name: MOPS 公告監控

on:
  schedule:
    - cron: "0 * * * *"     # 每小時執行一次
  workflow_dispatch:         # 允許手動觸發

permissions:
  contents: write            # 允許 commit seen_announcements.json 回 repo

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # 使用 PAT 以便後面能 push 回 main
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Build config.json from secrets
        env:
          NOTIFY_METHOD: ${{ secrets.NOTIFY_METHOD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
        run: |
          python - <<'EOF'
          import json, os

          keywords_raw = os.environ.get("KEYWORDS", "發行")
          keywords = [k.strip() for k in keywords_raw.split(",") if k.strip()]

          config = {
              "mops_url": "https://mopsov.twse.com.tw/mops/web/ezsearch",
              "keywords": keywords,
              "check_interval_seconds": 300,
              "notify_method": os.environ.get("NOTIFY_METHOD", "console"),
              "discord": {
                  "webhook_url": os.environ.get("DISCORD_WEBHOOK", "")
              },
              "telegram": {
                  "bot_token": os.environ.get("TELEGRAM_BOT_TOKEN", ""),
                  "chat_id": os.environ.get("TELEGRAM_CHAT_ID", "")
              },
              "line_notify": {
                  "token": os.environ.get("LINE_NOTIFY_TOKEN", "")
              }
          }

          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)

          print("config.json 建立完成，keywords:", keywords)
          EOF

      - name: Debug HTML structure
        run: |
          python - <<'EOF'
          import requests, urllib3
          urllib3.disable_warnings()
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/123.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "zh-TW,zh;q=0.9",
              "Referer": "https://mopsov.twse.com.tw/mops/web/ezsearch",
          }
          s = requests.Session()
          s.headers.update(headers)
          s.verify = False
          url = "https://mopsov.twse.com.tw/mops/web/ezsearch"
          r = s.get(url, timeout=15)
          print("=== GET form fields ===")
          from bs4 import BeautifulSoup
          soup = BeautifulSoup(r.text, "lxml")
          for inp in soup.find_all(["input", "select"]):
              print(inp.get("name"), inp.get("type"), inp.get("value","")[:50])
          # 嘗試多種 step 值
          for step_val in ["1", "2"]:
              form_data = {"step": step_val, "keyword": "發行", "co_id": "", "TYPEK": "all", "LEG": "TW", "RADIO_CM": "1", "AN": "1", "SDATE": "", "EDATE": ""}
              r2 = s.post(url, data=form_data, timeout=20)
              print(f"\n=== POST step={step_val} status:{r2.status_code} len:{len(r2.text)} ===")
              soup2 = BeautifulSoup(r2.text, "lxml")
              tables = soup2.find_all("table")
              print("table 數量:", len(tables))
              # 印出 body 前 800 字看結構
              body = soup2.find("body")
              print("body 前800字:", (body.get_text(separator=" ", strip=True) if body else r2.text)[:800])
          EOF

      - name: Run monitor (single pass)
        run: python monitor.py --once

      - name: Save status files back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_announcements.json status.json
          # 只有檔案有變動才 commit（避免空 commit）
          git diff --staged --quiet || git commit -m "chore: update monitor status [skip ci]"
          git push
